<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de contatos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="perfil">
      <label>
        Perfil
        <select id="selPerfil"></select>
      </label>
      <button id="btnNovoPerfil" class="btn">Novo</button>
      <button id="btnExcluirPerfil" class="btn">Excluir</button>
    </div>

    <div class="topo">
      <input id="busca" type="search" placeholder="Buscar nome ou número">
      <label>
        Remover início
        <input id="prefixo" value="55" size="3">
      </label>
    </div>

    <div class="abas">
      <button class="ativa" data-filtro="0">Pendentes</button>
      <button data-filtro="1">1ª ligação</button>
      <button data-filtro="2">2ª ligação</button>
      <button data-filtro="3">3ª ligação</button>
      <button data-filtro="4">4ª ligação</button>
      <button data-filtro="todos">Todos</button>
      <button data-filtro="excluidos">Excluídos</button>
    </div>
    <div id="contador"></div>

    <button id="btnColar" class="btn">+ Colar contatos</button>

    <div id="painelColar" hidden>
      <textarea id="areaColar" placeholder="Cole os contatos aqui, um por linha.&#10;Exemplos:&#10;Maria 11 98765-4321&#10;(11) 98765-4321 João"></textarea>
      <div class="acoes">
        <button id="btnAdicionar" class="btn">Adicionar</button>
        <button id="btnOrdenar" class="btn">Ordenar A-Z</button>
        <button id="btnExportar" class="btn">Exportar backup</button>
        <button id="btnImportar" class="btn">Importar backup</button>
        <button id="btnApagar" class="btn">Apagar lista</button>
      </div>
      <input id="arquivoImportar" type="file" accept=".json" hidden>
    </div>
  </header>

  <main>
    <table>
      <tbody id="tabela"></tbody>
    </table>
  </main>

  <div id="aviso"></div>

  <script src="app.js"></script>
</body>
</html>
